# Supabase CLI configuration for Yare Pages.
# Link this folder to your own project and push its migrations:
#   npx supabase link --project-ref <your-project-ref>
#   npm run db:push
# Then deploy the Edge Function that reads your websites' visitors from Cloudflare:
#   npx supabase functions deploy yarepages-sync --project-ref <your-project-ref>
project_id = "yare-pages"

# The function checks the owner's sign-in itself, so the gateway does not need a JWT. This also
# lets the new publishable keys call it.
[functions.yarepages-sync]
verify_jwt = false
